provider: local
model: Qwen/Qwen3-4B
temperature: 0.0
max_tokens: 512
concurrency: 4
use_vllm: false

# Matcher
corpus_scope: dep_papers  # match training-time scope so TP/FP signal is comparable

# MDP hyperparameters
horizon: 6
top_k: 10
alpha: 0.1
beta: 1.0

# Paths
cache_dir: cache
results_dir: results
