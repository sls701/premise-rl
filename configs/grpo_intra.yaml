run_name: reinforce_v2

# Data
table: rl_train
use_intra: false   # reward on true_dep_ids
max_targets: 200   # subsample for faster convergence

# Model (pin snapshot — never use moving alias)
model: Qwen/Qwen3-4B

# LoRA
lora_rank: 16
lora_alpha: 32
lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# REINFORCE hyperparameters
group_size: 4        # 4 rollouts per target; within-group advantage normalisation
temperature: 1.0     # higher entropy → more diverse rollouts, fewer degenerate groups
ema_decay: 0.99      # EMA baseline decay (only used when group_size == 1)
lr: 1.0e-5           # 10× prior; observed strong gradients but minimal weight movement at 1e-6
batch_size: 2        # 2 targets per rollout batch (8 sequences total)
grad_accum: 8        # effective targets per optimizer step = 16 (smoother gradient)
epochs: 5
max_completion_length: 128
seed: 42

# MDP
horizon: 6
top_k: 10
alpha: 0.05          # reduced from 0.1; lighter FP penalty encourages early exploration
beta: 1.0

# Checkpointing / logging
save_steps: 12   # ~1 checkpoint per epoch (12.5 steps/epoch with effective batch=16)
logging_steps: 1
use_wandb: false

# Paths
cache_dir: cache
results_dir: results
checkpoint_dir: checkpoints
