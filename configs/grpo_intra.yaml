run_name: reinforce_intra

# Data
table: rl_train
use_intra: false   # reward on true_dep_ids
max_targets: 200   # subsample for faster convergence
corpus_scope: dep_papers  # all statements in papers that contain a dep — gives matcher a richer universe so retrievals get honest TP/FP signal

# Model (pin snapshot — never use moving alias)
model: Qwen/Qwen3-4B

# LoRA
lora_rank: 16
lora_alpha: 32
lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# REINFORCE hyperparameters — tuned for 97 GB VRAM (RTX PRO 6000 Blackwell)
group_size: 4        # 4 rollouts per target; within-group advantage normalisation
temperature: 0.7
ema_decay: 0.99      # EMA baseline decay (only used when group_size == 1)
lr: 1.0e-6
batch_size: 2        # 2 targets per rollout batch (8 sequences total)
grad_accum: 4        # effective targets per optimizer step = 8
epochs: 3
max_completion_length: 128
seed: 42

# MDP
horizon: 6
top_k: 10
alpha: 0.1
beta: 1.0

# Checkpointing / logging
save_steps: 100
logging_steps: 1
use_wandb: false

# Paths
cache_dir: cache
results_dir: results
checkpoint_dir: checkpoints
