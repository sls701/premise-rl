run_name: gspo_intra_v3_cont

# Continue from v3 step_10; same LR/hyperparams, run through epoch 1
resume_from: checkpoints/gspo_intra_v3/step_10

# Data
table: rl_train
use_intra: false
max_targets: 200

# Model
model: Qwen/Qwen3-4B

# LoRA
lora_rank: 16
lora_alpha: 32
lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# GSPO hyperparameters
group_size: 4
temperature: 1.5
clip_eps: 0.2
lr: 5.0e-7
batch_size: 2
grad_accum: 4
epochs: 2
max_completion_length: 128
seed: 43

# MDP
horizon: 6
top_k: 20
alpha: 0.0
beta: 1.0

# Checkpointing / logging
save_steps: 5           # more frequent saves to track progress
logging_steps: 1

# Paths
cache_dir: cache
results_dir: results
checkpoint_dir: checkpoints
