[project]
name = "premise-rl"
version = "0.1.0"
description = "RL agent for logical dependency retrieval in mathematical theorem corpora"
requires-python = ">=3.11"
dependencies = [
    # Database
    "psycopg2-binary",
    "boto3",
    "python-dotenv",
    # HTTP / async
    "httpx[http2]",
    "diskcache",
    # Fuzzy matching
    "rapidfuzz",
    # ML core
    "torch",
    "transformers",
    "peft",
    "accelerate",
    "bitsandbytes",
    "trl",
    # Provider SDKs
    "openai",
    "google-generativeai",
    # Utilities
    "pyyaml",
    "tqdm",
    "google-genai>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
